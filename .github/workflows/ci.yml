name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Verify Vitest ownership contract registry
        run: |
          node scripts/verify-vitest-ownership-contracts.mjs --self-test
          node scripts/run-vitest-logical-group.mjs --self-test

  test-shard:
    name: test shard (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - domain-core-rebuild
          - domain-core-rest
          - application
          - application-service-core
          - application-service-role-actions
          - application-service-information-and-later-actions
          - application-service-compatibility-and-failure-boundaries
          - application-service-dreamer-vortox
          - engines-and-projections

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: ${{ matrix.group == 'domain-core-rest' && '0' || '1' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test shard
        id: test-shard
        continue-on-error: true
        run: node scripts/run-vitest-logical-group.mjs run --mode ordinary --logical-group-id "${{ matrix.group }}"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.group }}
          path: .vitest-test/segmented/${{ matrix.group }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Enforce test shard result
        if: always()
        shell: bash
        run: test "${{ steps.test-shard.outcome }}" = "success"

  test-merge:
    name: test merge and semantic gates
    runs-on: ubuntu-latest
    needs: test-shard

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download test evidence
        uses: actions/download-artifact@v5
        with:
          pattern: test-evidence-*
          path: .vitest-test/segmented-global/incoming-evidence

      - name: Verify ordinary singleton evidence and semantic union
        run: node scripts/run-vitest-logical-group.mjs aggregate --mode ordinary

  coverage-shard:
    name: coverage shard (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - domain-core-rebuild
          - domain-core-rest
          - application
          - application-service-core
          - application-service-role-actions
          - application-service-information-and-later-actions-base
          - application-service-information-and-later-actions-a3b2
          - application-service-compatibility-and-failure-boundaries
          - application-service-dreamer-vortox-core
          - application-service-dreamer-vortox-gained
          - engines-and-projections

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Coverage shard
        id: coverage-shard
        continue-on-error: true
        run: node scripts/run-vitest-logical-group.mjs run --mode coverage --logical-group-id "${{ matrix.group }}"

      - name: Upload coverage shard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence-${{ matrix.group }}
          path: .vitest-coverage/segmented/${{ matrix.group }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Enforce coverage shard result
        if: always()
        shell: bash
        run: |
          case "${{ steps.coverage-shard.outcome }}" in
            success)
              exit 0
              ;;
            failure|cancelled)
              exit 1
              ;;
            *)
              echo "Unexpected coverage shard outcome: ${{ steps.coverage-shard.outcome }}" >&2
              exit 1
              ;;
          esac

  coverage-merge:
    name: coverage merge and semantic gates
    runs-on: ubuntu-latest
    needs: coverage-shard

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download coverage evidence
        uses: actions/download-artifact@v5
        with:
          pattern: coverage-evidence-*
          path: .vitest-coverage/segmented-global/incoming-evidence

      - name: Merge coverage-only blobs and verify semantic union
        run: node scripts/run-vitest-logical-group.mjs aggregate --mode coverage

      - name: Verify merged coverage against exact source profile
        run: >-
          node scripts/verify-coverage-obligations.mjs
          --validate-candidate .vitest-coverage/segmented-global/coverage-output/coverage-final.json
          --profile phase-3-slice-2c-correction-98a27cf-coverage-v1

  deterministic-windows:
    name: deterministic setup/assignment/knowledge/projections/tasks/system-info/role-actions/philosopher-choice/snake-charmer/evil-twin/witch/dreamer/clockmaker
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Deterministic setup tests
        run: pnpm --filter @botc/setup-engine test

      - name: Deterministic assignment tests
        run: pnpm --filter @botc/assignment-engine test

      - name: Initial private knowledge tests
        run: pnpm --filter @botc/information-engine test

      - name: Clockmaker domain and replay tests
        run: pnpm exec vitest run --workspace vitest.workspace.ts packages/domain-core/src/clockmaker.test.ts packages/domain-core/src/clockmaker-replay.test.ts packages/domain-core/src/philosopher-ability.test.ts

      - name: Projection leakage tests
        run: pnpm --filter @botc/projections test

      - name: First-night task plan tests
        run: pnpm --filter @botc/task-engine test

      - name: First-night application evidence groups (W1-W6 plus isolated W7)
        run: node scripts/verify-vitest-windows-application-groups.mjs run --output-dir "${{ github.workspace }}\.vitest-windows-application"

      - name: Upload Windows application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-application-evidence
          path: .vitest-windows-application
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
